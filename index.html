<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>नत्थी — फाइल स्क्रूटनी</title>
<style>
:root{--paper:#EDF0F3;--card:#fff;--ink:#132238;--ink-2:#4A5C72;--line:#D3DAE2;
  --seal:#A32C2C;--ok:#1B7A4C;--na:#8A93A0;--warn:#B4761A;--r:10px;
  --sh:0 1px 2px rgba(19,34,56,.07),0 6px 16px rgba(19,34,56,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",system-ui,sans-serif;
  font-size:15px;line-height:1.45;padding-bottom:96px;overflow-x:hidden}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:40;background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:9px}
.seal{width:30px;height:30px;border-radius:50%;border:2px solid var(--seal);display:grid;place-items:center;
  font-size:13px;font-weight:700;background:rgba(163,44,44,.5);flex:0 0 auto}
header h1{font-size:16px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;font-size:10.5px;font-weight:400;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:58vw}
header .htxt{min-width:0}
header .sp{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.hbtn{background:rgba(255,255,255,.13);border:0;color:#fff;padding:9px 12px;border-radius:8px;font-size:13px}
.hbtn:active{background:rgba(255,255,255,.28)}
.wrap{padding:12px;max-width:820px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.card-pad{padding:12px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
label.f{display:block;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);margin:0 0 3px}
input[type=text],input[type=date],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:15px}
textarea{resize:vertical;min-height:46px}
input:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
.mb8{margin-bottom:8px}
.caseitem{display:block;width:100%;text-align:left;border:0;background:transparent;padding:0}
.cno{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.top{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.ctype{font-size:11px;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--ink-2)}
.parties{font-size:13px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:var(--paper);border-radius:99px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.meta{display:flex;gap:10px;font-size:11px;color:var(--ink-2);margin-top:6px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.item{border-top:1px solid var(--line)}.item:first-child{border-top:0}
.ihead{display:flex;align-items:center;gap:9px;padding:11px 12px;background:#fff;width:100%;border:0;text-align:left}
.ihead:active{background:#F4F7FA}
.dot{width:22px;height:22px;border-radius:6px;flex:0 0 auto;display:grid;place-items:center;font-size:13px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--na)}
.dot.yes{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.no{background:var(--seal);border-color:var(--seal);color:#fff}
.dot.na{background:var(--na);border-color:var(--na);color:#fff}
.iname{flex:1;min-width:0;font-size:14.5px;font-weight:600}
.isub{font-size:11px;color:var(--ink-2);font-weight:400}
.pin{font-size:11px;color:var(--ink-2);flex:0 0 auto}
.ibody{padding:0 12px 12px;background:#FBFCFD;border-top:1px dashed var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;background:#fff;padding:10px 4px;font-size:13.5px;font-weight:600;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on[data-v=yes]{background:var(--ok);color:#fff}
.seg button.on[data-v=no]{background:var(--seal);color:#fff}
.seg button.on[data-v=na]{background:var(--na);color:#fff}
.seg.natseg button.on{background:var(--ink);color:#fff}
.shots{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.shot{width:70px;height:70px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--paper);position:relative;padding:0}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot b{position:absolute;inset:auto 0 0 0;background:rgba(19,34,56,.7);color:#fff;font-size:9px;padding:1px 3px;font-weight:500}
.addshot{width:70px;height:70px;border:1.5px dashed var(--line);border-radius:8px;background:#fff;color:var(--ink-2);font-size:10.5px;display:grid;place-items:center;line-height:1.25;text-align:center}
.addshot span{font-size:18px;display:block}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px 13px;font-size:14px;font-weight:600}
.btn:active{background:var(--paper)}
.btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--seal);border-color:#E9C9C9}
.fabs{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:35;display:flex;gap:9px;justify-content:center}
.fab{background:var(--ink);color:#fff;border:0;border-radius:99px;padding:14px 22px;font-size:15px;font-weight:700;box-shadow:0 8px 24px rgba(19,34,56,.3)}
.fab.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.viewer{position:fixed;inset:0;background:#0B121C;z-index:80;display:none;flex-direction:column}
.viewer.on{display:flex}
.viewer .vtop{display:flex;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;color:#fff;align-items:center;font-size:13px}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vbot{padding:10px 12px calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:8px;justify-content:center}
.scan{position:fixed;inset:0;background:#000;z-index:85;display:none;flex-direction:column}
.scan.on{display:flex}
.scan video{flex:1;min-height:0;width:100%;object-fit:cover}
.scan .frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:66vw;max-width:300px;aspect-ratio:1;
  border:2px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.scan .stop{padding:12px 12px calc(env(safe-area-inset-bottom) + 14px);display:flex;gap:8px;justify-content:center;background:#000;z-index:2}
.scan .msg{color:#fff;text-align:center;font-size:13px;padding:calc(env(safe-area-inset-top) + 10px) 16px 4px;z-index:2}
.modal{position:fixed;inset:0;background:rgba(11,18,28,.5);z-index:95;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:14px 14px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h3{font-size:16px;margin-bottom:6px}.sheet p{margin:0 0 12px;color:var(--ink-2);font-size:14px}
.empty{text-align:center;color:var(--ink-2);padding:44px 18px;font-size:14px}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}
.eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:16px 2px 7px;font-weight:600}
.toast{position:fixed;bottom:98px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.hide{display:none!important}
.printhead{display:none}
@media print{header,.fabs,.noprint{display:none!important}
  body{background:#fff;padding:0;font-size:12px}
  .card{box-shadow:none;page-break-inside:avoid;border-color:#999}
  .printhead{display:block;text-align:center;padding:10px 0 4px;border-bottom:2px solid #000;margin-bottom:10px}}
</style>
</head>
<body>
<header>
  <div class="seal">न</div>
  <div class="htxt"><h1 id="hTitle">नत्थी</h1><small id="hSub">फाइल स्क्रूटनी</small></div>
  <div class="sp"><button class="hbtn" id="btnBack" style="display:none">‹</button><button class="hbtn" id="btnSet">⚙</button></div>
</header>
<div class="printhead" id="printHead"></div>
<div class="wrap" id="app"></div>
<div class="fabs" id="fabs"><button class="fab alt" id="fabScan">QR स्कैन</button><button class="fab" id="fab">+ नई फाइल</button></div>

<div class="viewer" id="viewer">
  <div class="vtop"><button class="hbtn" id="vClose">✕</button><span id="vLabel"></span><span style="margin-left:auto" id="vCount"></span></div>
  <img id="vImg" alt="">
  <div class="vbot"><button class="btn" id="vPrev">‹</button><button class="btn danger" id="vDel">फोटो हटाएँ</button><button class="btn" id="vNext">›</button></div>
</div>

<div class="scan" id="scan">
  <div class="msg" id="scanMsg">फाइल के लेबल का QR कैमरे के सामने रखें</div>
  <video id="scanVid" playsinline muted></video><div class="frame"></div>
  <div class="stop"><button class="btn" id="scanClose">बंद करें</button><button class="btn" id="scanManual">कोड टाइप करें</button></div>
</div>

<div class="modal" id="modal"><div class="sheet">
  <h3 id="mTitle"></h3><p id="mMsg" class="hide"></p>
  <input type="text" id="mInput" class="hide mb8">
  <div class="row"><button class="btn" id="mNo">रद्द</button><button class="btn solid" id="mYes">ठीक</button></div>
</div></div>

<input type="file" id="picker" accept="image/*" capture="environment" multiple class="hide">
<input type="file" id="pickerGal" accept="image/*" multiple class="hide">
<input type="file" id="restorePick" accept="application/json" class="hide">
<div class="toast" id="toast"></div>

<script>
/* ===== settings ===== */
const S={get(){try{return JSON.parse(localStorage.getItem('natthi_set'))||{}}catch(e){return{}}},
  set(o){localStorage.setItem('natthi_set',JSON.stringify(o))}};
let SET=Object.assign({court:'',officer:'',defNat:'अ'},S.get());

/* ===== db (v2: alag halka index store) ===== */
const DB_NAME='court_scrutiny',DB_VER=2;let db;
function openDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains('files')){const s=d.createObjectStore('files',{keyPath:'id'});s.createIndex('updatedAt','updatedAt')}
    if(!d.objectStoreNames.contains('photos')){const p=d.createObjectStore('photos',{keyPath:'id'});
      p.createIndex('fileId','fileId');p.createIndex('fileItem',['fileId','itemKey'])}
    if(!d.objectStoreNames.contains('idx')){const x=d.createObjectStore('idx',{keyPath:'id'});
      x.createIndex('updatedAt','updatedAt');x.createIndex('qr','qr');x.createIndex('caseNo','caseNo')}};
  r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}
const tx=(s,m='readonly')=>db.transaction(s,m).objectStore(s);
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const DEFAULT_ITEMS=[
 ['order','आदेश पत्र','Order Sheet','अ'],['fir','एफ.आई.आर.','FIR','ब'],['tehreer','तहरीर','','ब'],
 ['chargesheet','आरोप पत्र','Charge Sheet','ब'],['fard','फर्द बरामदगी / नक्शा नजरी','','ब'],
 ['medical','मेडिकल रिपोर्ट','','ब'],['pm','पोस्टमार्टम रिपोर्ट','','ब'],['s161','161 बयान','','ब'],
 ['s164','164 बयान','','ब'],['pw','अभियोजन साक्षी बयान','PW','अ'],['dw','बचाव साक्षी बयान','DW','अ'],
 ['s313','313 बयान','','अ'],['bail','जमानत प्रपत्र','Bail Papers','अ'],['process','सम्मन / वारंट तामीला','','अ'],
 ['exhibit','प्रदर्श सूची','Exhibits','अ'],['other','अन्य कागज़','Others','']];
const newItems=()=>DEFAULT_ITEMS.map(([k,n,s,nat])=>({key:k,name:n,sub:s,nat,status:'',pages:'',note:''}));
const blankFile=()=>({id:uid(),caseNo:'',caseType:'',year:new Date().getFullYear(),parties:'',ps:'',us:'',qr:'',
  recvDate:new Date().toISOString().slice(0,10),totalPages:'',remark:'',items:newItems(),
  court:SET.court,createdAt:Date.now(),updatedAt:Date.now()});

const done=f=>f.items.filter(i=>i.status).length;
const idxOf=f=>({id:f.id,caseNo:f.caseNo||'',caseType:f.caseType||'',year:f.year||'',parties:f.parties||'',
  ps:f.ps||'',us:f.us||'',qr:f.qr||'',d:done(f),t:f.items.length,updatedAt:f.updatedAt,
  sk:[f.caseNo,f.parties,f.ps,f.us,f.caseType,f.year,f.qr].join(' ').toLowerCase()});

function saveFile(f){f.updatedAt=Date.now();
  return new Promise((res,rej)=>{const t=db.transaction(['files','idx'],'readwrite');
    t.objectStore('files').put(f);t.objectStore('idx').put(idxOf(f));
    t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
const getFile=id=>req(tx('files').get(id));
function delFile(id){return new Promise(async(res,rej)=>{
  const ks=await req(tx('photos').index('fileId').getAllKeys(IDBKeyRange.only(id)));
  const t=db.transaction(['files','idx','photos'],'readwrite');
  ks.forEach(k=>t.objectStore('photos').delete(k));
  t.objectStore('files').delete(id);t.objectStore('idx').delete(id);
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

/* page ke hisaab se hi records padho — 3000 files par bhi list turant khulti hai */
function pageIdx(beforeKey,n=30){return new Promise((res,rej)=>{
  const out=[],range=beforeKey!=null?IDBKeyRange.upperBound(beforeKey,true):null;
  const r=tx('idx').index('updatedAt').openCursor(range,'prev');
  r.onsuccess=e=>{const c=e.target.result;
    if(!c||out.length>=n)return res(out);
    out.push(c.value);c.continue()};
  r.onerror=()=>rej(r.error)})}
function searchIdx(q,limit=60){return new Promise((res,rej)=>{
  const out=[],r=tx('idx').index('updatedAt').openCursor(null,'prev');
  r.onsuccess=e=>{const c=e.target.result;
    if(!c||out.length>=limit)return res(out);
    if(c.value.sk.includes(q))out.push(c.value);c.continue()};
  r.onerror=()=>rej(r.error)})}
async function findByCode(code){
  const q=code.trim();if(!q)return null;
  let hit=await req(tx('idx').index('qr').get(q));if(hit)return hit;
  hit=await req(tx('idx').index('caseNo').get(q));if(hit)return hit;
  const s=await searchIdx(q.toLowerCase(),1);return s[0]||null}

const photoKeys=(f,k)=>req(tx('photos').index('fileItem').getAllKeys(IDBKeyRange.only([f,k])));
async function photoCounts(fileId){
  const m={};return new Promise(res=>{
    const r=tx('photos').index('fileId').openCursor(IDBKeyRange.only(fileId));
    r.onsuccess=e=>{const c=e.target.result;if(!c)return res(m);
      m[c.value.itemKey]=(m[c.value.itemKey]||0)+1;c.continue()};r.onerror=()=>res(m)})}
const getPhoto=id=>req(tx('photos').get(id));
const putPhoto=p=>req(tx('photos','readwrite').put(p));
const delPhoto=id=>req(tx('photos','readwrite').delete(id));

async function shrink(file){
  let bmp;
  try{bmp=await createImageBitmap(file)}catch(e){
    bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=URL.createObjectURL(file)})}
  const W=bmp.width||bmp.naturalWidth,H=bmp.height||bmp.naturalHeight;
  const draw=(max,q)=>{const sc=Math.min(1,max/Math.max(W,H));const c=document.createElement('canvas');
    c.width=Math.round(W*sc);c.height=Math.round(H*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return new Promise(r=>c.toBlob(r,'image/jpeg',q))};
  const full=await draw(1400,.6),thumb=await draw(180,.55);
  bmp.close&&bmp.close();return{full,thumb}}

/* ===== ui ===== */
const $=s=>document.querySelector(s),app=$('#app');
let tT;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2000)};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ask({title,msg,input,value,ok='ठीक',danger}){
  return new Promise(res=>{
    $('#mTitle').textContent=title;const m=$('#mMsg');m.textContent=msg||'';m.classList.toggle('hide',!msg);
    const i=$('#mInput');i.classList.toggle('hide',!input);i.value=value||'';i.placeholder=typeof input==='string'?input:'';
    const y=$('#mYes');y.textContent=ok;y.classList.toggle('danger',!!danger);y.classList.toggle('solid',!danger);
    $('#modal').classList.add('on');if(input)setTimeout(()=>i.focus(),120);
    const close=v=>{$('#modal').classList.remove('on');y.onclick=$('#mNo').onclick=i.onkeydown=null;res(v)};
    y.onclick=()=>close(input?(i.value.trim()||null):true);$('#mNo').onclick=()=>close(null);
    i.onkeydown=e=>{if(e.key==='Enter')y.click()}})}
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#mNo').click()};

let view='list',cur=null;
const setHead=(t,s,back)=>{$('#hTitle').textContent=t;$('#hSub').textContent=s;$('#btnBack').style.display=back?'':'none'};
const rowHTML=x=>`<div class="card"><div class="card-pad"><button class="caseitem" data-id="${x.id}">
  <div class="top"><span class="cno">${esc(x.caseNo)||'—'}</span>
    ${x.caseType?`<span class="ctype">${esc(x.caseType)}</span>`:''}${x.year?`<span class="ctype">${esc(x.year)}</span>`:''}</div>
  <div class="parties">${esc(x.parties)||'पक्षकार दर्ज नहीं'}</div>
  <div class="bar"><i style="width:${Math.round(x.d/(x.t||1)*100)}%;background:${x.d===x.t?'var(--ok)':'var(--warn)'}"></i></div>
  <div class="meta"><span>${x.d}/${x.t} कागज़ जाँचे</span>${x.ps?`<span>थाना ${esc(x.ps)}</span>`:''}${x.qr?`<span>QR ${esc(x.qr)}</span>`:''}</div>
</button></div></div>`;

/* ---------- list (paged) ---------- */
let lastKey=null,loading=false,ended=false,io=null;
async function renderList(){
  view='list';cur=null;
  setHead('नत्थी',SET.court||'फाइल स्क्रूटनी',false);
  $('#fabs').classList.remove('hide');$('#printHead').innerHTML='';
  const total=await req(tx('idx').count());
  if(!total){app.innerHTML=`<div class="empty"><b>अभी कोई फाइल दर्ज नहीं</b>
    चार्ज लेते समय हर पत्रावली यहाँ जोड़ें — मुकदमा संख्या भरें, कागज़ात टिक करें, ज़रूरी पन्ने की फोटो खींच लें।</div>`;return}
  app.innerHTML=`<div class="eyebrow">${total} फाइल</div>
    <input type="text" id="q" placeholder="मुकदमा संख्या / पक्षकार / थाना खोजें" class="mb8">
    <div id="rows"></div><div id="sent" style="height:40px"></div>`;
  lastKey=null;ended=false;loading=false;
  const rows=$('#rows');
  rows.onclick=e=>{const b=e.target.closest('.caseitem');if(b)openCase(b.dataset.id)};
  await more();
  io&&io.disconnect();
  io=new IntersectionObserver(es=>{if(es[0].isIntersecting)more()},{rootMargin:'300px'});
  io.observe($('#sent'));
  let t;$('#q').oninput=e=>{clearTimeout(t);const v=e.target.value.trim().toLowerCase();
    t=setTimeout(async()=>{
      if(!v){ended=false;lastKey=null;rows.innerHTML='';io.observe($('#sent'));return more()}
      io.disconnect();ended=true;
      const r=await searchIdx(v);
      rows.innerHTML=r.length?r.map(rowHTML).join(''):'<div class="empty">कोई मेल नहीं मिला</div>'},250)};
}
async function more(){
  if(loading||ended||view!=='list')return;loading=true;
  const page=await pageIdx(lastKey,30);
  if(page.length){lastKey=page[page.length-1].updatedAt;
    $('#rows').insertAdjacentHTML('beforeend',page.map(rowHTML).join(''))}
  if(page.length<30){ended=true;io&&io.disconnect()}
  loading=false}

/* ---------- case ---------- */
async function openCase(id){
  const f=await getFile(id);if(!f)return renderList();
  view='case';cur=f;
  setHead(f.caseNo||'नई फाइल',(f.caseType||'स्क्रूटनी')+(f.year?' / '+f.year:''),true);
  $('#fabs').classList.add('hide');
  $('#printHead').innerHTML=`<h2>${esc(SET.court||'न्यायालय')}</h2><div>पत्रावली स्क्रूटनी सूची${SET.officer?' — '+esc(SET.officer):''}</div>`;
  const counts=await photoCounts(f.id);
  app.innerHTML=`
  <div class="card"><div class="card-pad">
    <div class="row mb8"><div style="flex:2"><label class="f">मुकदमा संख्या</label><input type="text" id="fCaseNo" value="${esc(f.caseNo)}"></div>
      <div><label class="f">वर्ष</label><input type="text" id="fYear" value="${esc(f.year)}" inputmode="numeric"></div></div>
    <div class="row mb8"><div><label class="f">प्रकार</label><input type="text" id="fType" value="${esc(f.caseType)}" placeholder="Cr. Case / ST"></div>
      <div><label class="f">थाना</label><input type="text" id="fPs" value="${esc(f.ps)}"></div></div>
    <div class="mb8"><label class="f">पक्षकार</label><input type="text" id="fParties" value="${esc(f.parties)}" placeholder="सरकार बनाम …"></div>
    <div class="row mb8"><div><label class="f">धारा</label><input type="text" id="fUs" value="${esc(f.us)}"></div>
      <div><label class="f">कुल पृष्ठ</label><input type="text" id="fPages" value="${esc(f.totalPages)}" inputmode="numeric"></div></div>
    <div class="mb8"><label class="f">प्राप्ति तिथि</label><input type="date" id="fRecv" value="${esc(f.recvDate)}"></div>
    <label class="f">QR / लेबल कोड</label>
    <div class="row mb8"><div style="flex:2"><input type="text" id="fQr" value="${esc(f.qr)}" placeholder="फाइल पर चिपके लेबल का कोड"></div>
      <button class="btn noprint" id="qrLink" style="flex:0 0 auto">स्कैन</button></div>
    <label class="f">टिप्पणी / कमी</label><textarea id="fRemark">${esc(f.remark)}</textarea>
  </div></div>
  <div class="eyebrow">कागज़ात की जाँच <span id="prog"></span></div>
  <div class="card" id="items"></div>
  <div class="card noprint"><div class="card-pad">
    <label class="f">अतिरिक्त कागज़ जोड़ें</label>
    <div class="row"><div style="flex:2"><input type="text" id="newName" placeholder="जैसे — सी.डी. / प्रदर्श क-1"></div>
      <button class="btn solid" id="addNamed" style="flex:0 0 auto">जोड़ें</button></div>
    <div class="row" style="margin-top:8px"><button class="btn" id="addPw">+ PW</button><button class="btn" id="addDw">+ DW</button></div>
  </div></div>
  <div class="row noprint" style="margin-bottom:34px">
    <button class="btn" id="printCase">रिपोर्ट प्रिंट</button><button class="btn danger" id="delCase">फाइल हटाएँ</button></div>`;

  const prog=()=>{$('#prog').textContent='· '+done(f)+'/'+f.items.length};
  const box=$('#items');
  box.innerHTML=f.items.map((it,i)=>itemHTML(it,i,counts[it.key]||0)).join('');prog();

  const bind=(sel,key,num)=>{const el=$(sel);el.onchange=async()=>{f[key]=num?el.value.replace(/\D/g,''):el.value;
    await saveFile(f);if(key==='caseNo')$('#hTitle').textContent=f.caseNo||'नई फाइल'}};
  bind('#fCaseNo','caseNo');bind('#fYear','year',1);bind('#fType','caseType');bind('#fPs','ps');
  bind('#fParties','parties');bind('#fUs','us');bind('#fPages','totalPages',1);bind('#fRecv','recvDate');
  bind('#fRemark','remark');bind('#fQr','qr');
  $('#qrLink').onclick=()=>startScan(async code=>{f.qr=code;$('#fQr').value=code;await saveFile(f);toast('लेबल जोड़ा: '+code)});

  box.onclick=async e=>{
    const seg=e.target.closest('.seg button'),add=e.target.closest('.addshot'),
          shot=e.target.closest('.shot'),rm=e.target.closest('.rmItem'),head=e.target.closest('.ihead');
    if(seg){const itEl=seg.closest('.item'),i=+itEl.dataset.i;
      if(seg.parentElement.classList.contains('natseg')){
        f.items[i].nat=f.items[i].nat===seg.dataset.v?'':seg.dataset.v;await saveFile(f);
        seg.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===f.items[i].nat));
        const l=itEl.querySelector('.natLbl');if(l)l.textContent=f.items[i].nat?'नत्थी '+f.items[i].nat:''}
      else{f.items[i].status=f.items[i].status===seg.dataset.v?'':seg.dataset.v;await saveFile(f);
        seg.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===f.items[i].status));
        const d=itEl.querySelector('.dot');d.className='dot '+(f.items[i].status||'');
        d.textContent={yes:'✓',no:'✕',na:'—'}[f.items[i].status]||'';prog()}return}
    if(add){pickFor(+add.closest('.item').dataset.i,add.dataset.src);return}
    if(shot){openViewer(+shot.closest('.item').dataset.i,+shot.dataset.n);return}
    if(rm){const i=+rm.closest('.item').dataset.i;
      if(!await ask({title:'पंक्ति हटाएँ?',msg:f.items[i].name+' और इसकी फोटो हट जाएँगी।',ok:'हटाएँ',danger:1}))return;
      for(const k of await photoKeys(f.id,f.items[i].key))await delPhoto(k);
      f.items.splice(i,1);await saveFile(f);openCase(f.id);return}
    if(head){const it=head.closest('.item'),body=it.querySelector('.ibody');
      const closed=body.classList.toggle('hide');
      if(closed)freeItem(it); else loadThumbs(it,f.items[+it.dataset.i].key)}};
  box.onchange=async e=>{const t=e.target;if(!t.matches('[data-fld]'))return;
    const i=+t.closest('.item').dataset.i;f.items[i][t.dataset.fld]=t.value;await saveFile(f);
    if(t.dataset.fld==='pages'){const p=t.closest('.item').querySelector('.pgLbl');if(p)p.textContent=t.value?'पृ. '+t.value:''}};

  const addItem=async(name,nat)=>{f.items.push({key:'c'+uid(),name,sub:'',nat:nat||SET.defNat||'',status:'',pages:'',note:''});
    await saveFile(f);await openCase(f.id);toast(name+' जोड़ा गया');window.scrollTo(0,document.body.scrollHeight)};
  $('#addNamed').onclick=()=>{const v=$('#newName').value.trim();if(!v)return toast('पहले कागज़ का नाम लिखें');addItem(v)};
  $('#newName').onkeydown=e=>{if(e.key==='Enter')$('#addNamed').click()};
  $('#addPw').onclick=()=>addItem('PW-'+(f.items.filter(x=>/^PW-/.test(x.name)).length+1)+' बयान','अ');
  $('#addDw').onclick=()=>addItem('DW-'+(f.items.filter(x=>/^DW-/.test(x.name)).length+1)+' बयान','अ');
  $('#printCase').onclick=()=>{document.querySelectorAll('.ibody').forEach(b=>b.classList.remove('hide'));setTimeout(()=>window.print(),120)};
  $('#delCase').onclick=async()=>{
    if(!await ask({title:'पूरी फाइल हटाएँ?',msg:(f.caseNo||'यह फाइल')+' और इसकी सभी फोटो स्थायी रूप से हट जाएँगी।',ok:'हटाएँ',danger:1}))return;
    try{await delFile(f.id);toast('फाइल हटा दी गई');renderList()}catch(err){toast('नहीं हटी: '+err)}};
}

function itemHTML(it,i,count){
  const mark={yes:'✓',no:'✕',na:'—'}[it.status]||'';
  return `<div class="item" data-i="${i}" data-key="${esc(it.key)}">
    <button class="ihead"><span class="dot ${it.status}">${mark}</span>
      <span class="iname">${esc(it.name)} ${it.sub?`<span class="isub">${esc(it.sub)}</span>`:''}
        <span class="isub pgLbl">${it.pages?'पृ. '+esc(it.pages):''}</span>
        <span class="isub natLbl">${it.nat?'नत्थी '+esc(it.nat):''}</span></span>
      ${count?`<span class="pin">📷 ${count}</span>`:''}</button>
    <div class="ibody hide">
      <div class="seg" style="margin:10px 0 9px">
        <button data-v="yes" class="${it.status==='yes'?'on':''}">है</button>
        <button data-v="no" class="${it.status==='no'?'on':''}">नहीं है</button>
        <button data-v="na" class="${it.status==='na'?'on':''}">लागू नहीं</button></div>
      <label class="f">नत्थी</label>
      <div class="seg natseg mb8"><button data-v="अ" class="${it.nat==='अ'?'on':''}">नत्थी अ</button>
        <button data-v="ब" class="${it.nat==='ब'?'on':''}">नत्थी ब</button></div>
      <div class="row mb8"><div><label class="f">पृष्ठ</label><input type="text" data-fld="pages" value="${esc(it.pages)}" placeholder="12–17"></div>
        <div style="flex:2"><label class="f">टिप्पणी</label><input type="text" data-fld="note" value="${esc(it.note)}"></div></div>
      <div class="shots" data-shots>
        <button class="addshot" data-src="cam"><span>📷</span>कैमरा</button>
        <button class="addshot" data-src="gal"><span>🖼</span>गैलरी</button></div>
      <div class="noprint" style="text-align:right;margin-top:8px">
        <button class="btn danger rmItem" style="font-size:12px;padding:6px 10px">पंक्ति हटाएँ</button></div>
    </div></div>`}

/* thumbnails sirf khuli hui pankti ke — band karte hi memory chhod di jaati hai */
function freeItem(itemEl){itemEl.querySelectorAll('.shot img').forEach(im=>{URL.revokeObjectURL(im.src);im.src=''});
  itemEl.querySelectorAll('.shot').forEach(s=>s.remove())}
async function loadThumbs(itemEl,key){
  const box=itemEl.querySelector('[data-shots]'),first=box.querySelector('.addshot');
  freeItem(itemEl);
  const ids=await photoKeys(cur.id,key);
  for(let n=0;n<ids.length;n++){const p=await getPhoto(ids[n]);if(!p)continue;
    const b=document.createElement('button');b.className='shot';b.dataset.n=n;
    b.innerHTML=`<img alt=""><b>${n+1}</b>`;b.querySelector('img').src=URL.createObjectURL(p.thumb);
    box.insertBefore(b,first)}
  const head=itemEl.querySelector('.ihead'),pin=head.querySelector('.pin');
  if(ids.length){pin?pin.textContent='📷 '+ids.length:head.insertAdjacentHTML('beforeend',`<span class="pin">📷 ${ids.length}</span>`)}
  else if(pin)pin.remove()}

/* ---------- camera / gallery ---------- */
let pickIndex=null;
const pickFor=(i,src)=>{pickIndex=i;const el=src==='gal'?$('#pickerGal'):$('#picker');el.value='';el.click()};
async function ingest(files){
  if(!files.length||pickIndex===null||!cur)return;
  const key=cur.items[pickIndex].key;toast(files.length+' फोटो सहेजी जा रही…');
  let ok=0;
  for(const file of files){try{const{full,thumb}=await shrink(file);
    await putPhoto({id:uid(),fileId:cur.id,itemKey:key,full,thumb,ts:Date.now()});ok++}
    catch(err){console.warn(err)}}
  const el=document.querySelector(`.item[data-i="${pickIndex}"]`);if(el)loadThumbs(el,key);
  toast(ok?ok+' फोटो सहेजी गई':'फोटो नहीं खुली — गैलरी से जोड़कर देखें')}
$('#picker').onchange=e=>ingest([...e.target.files]);
$('#pickerGal').onchange=e=>ingest([...e.target.files]);

/* ---------- viewer ---------- */
let vIds=[],vN=0,vKey=null,vItem=null,vURL=null;
async function openViewer(i,n){vItem=i;vKey=cur.items[i].key;vIds=await photoKeys(cur.id,vKey);vN=n;
  $('#vLabel').textContent=cur.items[i].name;$('#viewer').classList.add('on');showV()}
async function showV(){if(!vIds.length)return closeViewer();
  vN=(vN+vIds.length)%vIds.length;const p=await getPhoto(vIds[vN]);
  if(vURL)URL.revokeObjectURL(vURL);vURL=URL.createObjectURL(p.full);
  $('#vImg').src=vURL;$('#vCount').textContent=(vN+1)+' / '+vIds.length}
function closeViewer(){$('#viewer').classList.remove('on');$('#vImg').src='';if(vURL){URL.revokeObjectURL(vURL);vURL=null}}
$('#vClose').onclick=closeViewer;$('#vNext').onclick=()=>{vN++;showV()};$('#vPrev').onclick=()=>{vN--;showV()};
$('#vDel').onclick=async()=>{if(!await ask({title:'फोटो हटाएँ?',ok:'हटाएँ',danger:1}))return;
  await delPhoto(vIds[vN]);vIds.splice(vN,1);
  const el=document.querySelector(`.item[data-i="${vItem}"]`);if(el)loadThumbs(el,vKey);showV()};

/* ---------- QR scanner ---------- */
let scanStream=null,scanStop=false,onCode=null;
async function startScan(cb){
  onCode=cb;scanStop=false;$('#scan').classList.add('on');$('#scanMsg').textContent='फाइल के लेबल का QR कैमरे के सामने रखें';
  const v=$('#scanVid');
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    v.srcObject=scanStream;await v.play()}
  catch(e){$('#scanMsg').textContent='कैमरा नहीं खुला — नीचे "कोड टाइप करें" दबाएँ';return}
  if(!('BarcodeDetector' in window)){$('#scanMsg').textContent='इस डिवाइस में QR रीडर नहीं — कोड टाइप करें';return}
  const det=new BarcodeDetector({formats:['qr_code','code_128','ean_13']});
  const loop=async()=>{
    if(scanStop)return;
    try{const codes=await det.detect(v);
      if(codes.length){const val=codes[0].rawValue.trim();stopScan();navigator.vibrate&&navigator.vibrate(60);
        return onCode&&onCode(val)}}catch(e){}
    setTimeout(loop,260)};
  loop()}
function stopScan(){scanStop=true;$('#scan').classList.remove('on');
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}$('#scanVid').srcObject=null}
$('#scanClose').onclick=()=>{stopScan();onCode=null};
$('#scanManual').onclick=async()=>{stopScan();
  const v=await ask({title:'लेबल कोड',input:'कोड / मुकदमा संख्या',ok:'खोजें'});
  if(v&&onCode)onCode(v)};

async function scanToOpen(){
  startScan(async code=>{
    const hit=await findByCode(code);
    if(hit){toast('फाइल मिली');return openCase(hit.id)}
    const mk=await ask({title:'कोई फाइल नहीं मिली',msg:'कोड: '+code+' — इसी कोड से नई फाइल बनाएँ?',ok:'नई फाइल बनाएँ'});
    if(!mk)return;
    const f=blankFile();f.qr=code;if(/^\d{1,6}$/.test(code))f.caseNo=code;
    await saveFile(f);openCase(f.id)})}

/* ---------- settings ---------- */
function renderSettings(){
  view='set';setHead('सेटिंग','न्यायालय व बैकअप',true);
  $('#fabs').classList.add('hide');$('#printHead').innerHTML='';
  app.innerHTML=`<div class="card"><div class="card-pad">
    <div class="mb8"><label class="f">न्यायालय का नाम</label>
      <input type="text" id="sCourt" value="${esc(SET.court)}" placeholder="जैसे — न्यायालय ए.सी.जे.एम. संख्या 15, बागपत"></div>
    <div class="mb8"><label class="f">पीठासीन अधिकारी / पदनाम</label><input type="text" id="sOfficer" value="${esc(SET.officer)}"></div>
    <label class="f">नई पंक्ति की डिफ़ॉल्ट नत्थी</label>
    <div class="seg" id="sNat"><button data-v="अ" class="${SET.defNat==='अ'?'on':''}">अ</button><button data-v="ब" class="${SET.defNat==='ब'?'on':''}">ब</button></div>
    <button class="btn solid" id="sSave" style="width:100%;margin-top:12px">सेटिंग सहेजें</button></div></div>
  <div class="eyebrow">डेटा</div>
  <div class="card"><div class="card-pad">
    <div class="row mb8"><button class="btn" id="sBackup">बैकअप सहेजें</button><button class="btn" id="sRestore">बैकअप से जोड़ें</button></div>
    <div id="usage" style="font-size:13px;color:var(--ink-2)"></div>
    <p style="font-size:12.5px;margin:10px 0 0">बैकअप में केवल फाइल-विवरण जाता है। फोटो फोन के अंदर ही रहती हैं।</p></div></div>`;
  $('#sNat').onclick=e=>{const b=e.target.closest('button');if(!b)return;SET.defNat=b.dataset.v;
    $('#sNat').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))};
  $('#sSave').onclick=()=>{SET.court=$('#sCourt').value.trim();SET.officer=$('#sOfficer').value.trim();S.set(SET);toast('सेटिंग सहेज ली');renderList()};
  $('#sBackup').onclick=backup;$('#sRestore').onclick=()=>$('#restorePick').click();
  (async()=>{const q=await(navigator.storage?.estimate?.()||Promise.resolve(null));
    const nf=await req(tx('idx').count()),np=await req(tx('photos').count());
    $('#usage').textContent=`${nf} फाइल · ${np} फोटो · ${q?(q.usage/1048576).toFixed(1)+' MB प्रयुक्त':''}`})()}

/* ---------- backup ---------- */
function allFilesFull(){return new Promise(res=>{const out=[];const r=tx('files').openCursor();
  r.onsuccess=e=>{const c=e.target.result;if(!c)return res(out);out.push(c.value);c.continue()}})}
async function backup(){
  const files=await allFilesFull();
  const blob=new Blob([JSON.stringify({v:2,court:SET.court,exportedAt:new Date().toISOString(),files})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='natthi-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast(files.length+' फाइल का बैकअप डाउनलोड हुआ')}
$('#restorePick').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;
  try{const d=JSON.parse(await fl.text()),arr=d.files||[];
    await new Promise((res,rej)=>{const t=db.transaction(['files','idx'],'readwrite');
      arr.forEach(x=>{if(!x.items)x.items=newItems();t.objectStore('files').put(x);t.objectStore('idx').put(idxOf(x))});
      t.oncomplete=res;t.onerror=()=>rej(t.error)});
    toast(arr.length+' फाइल जोड़ी गईं');renderList()}
  catch(err){toast('यह बैकअप फाइल पढ़ी नहीं जा सकी')}};

/* index rebuild (purane data ke liye) */
async function ensureIdx(){
  const ni=await req(tx('idx').count()),nf=await req(tx('files').count());
  if(ni>=nf)return;
  const all=await allFilesFull();
  await new Promise(res=>{const t=db.transaction('idx','readwrite');
    all.forEach(f=>t.objectStore('idx').put(idxOf(f)));t.oncomplete=res})}

$('#btnBack').onclick=renderList;
$('#btnSet').onclick=()=>view==='set'?renderList():renderSettings();
$('#fab').onclick=async()=>{const f=blankFile();await saveFile(f);openCase(f.id)};
$('#fabScan').onclick=scanToOpen;
openDB().then(async()=>{await ensureIdx();navigator.storage?.persist?.();renderList()})
  .catch(e=>{app.innerHTML='<div class="empty"><b>संग्रहण नहीं खुला</b>'+e+'</div>'});
</script>
